version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: bank_core_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migration/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: bank_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: bank_repository_service
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: bank_repository

      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0

      API_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  postgres_data: