syntax = "proto3";

package repository.common;

option go_package = "github.com/Suinar/Bank-repository-service/proto/repository/common";

message Empty {}

message IdRequest {
  int64 id = 1;
}

message UserIdRequest {
  int64 user_id = 1;
}

message DeleteResponse {
  int64 rows_affected = 1;
}

message AmountRequest {
  int64 id = 1;
  int64 amount = 2;
}