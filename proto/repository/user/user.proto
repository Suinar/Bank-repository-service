syntax = "proto3";

package repository.user;

option go_package = "github.com/Suinar/Bank-repository-service/proto/repository/user";

import "repository/common/common.proto";

message EmailRequest {
  string email = 1;
}

message PhoneNumberRequest {
  string phone_number = 1;
}

message ChangePasswordRequest {
  int64 id = 1;
  string new_password = 2;
}

message User {
  int64 id = 1;

  string first_name = 2;
  optional string middle_name = 3;
  string last_name = 4;

  string email = 5;
  string phone_number = 6;

  string password_hash = 7;
}

message UserUpdateInput {
  optional string first_name = 1;
  optional string middle_name = 2;
  optional string last_name = 3;
}

message UpdateUserRequest {
  int64 id = 1;
  UserUpdateInput input = 2;
}

message UserList {
  repeated User users = 1;
}

service UserRepository {
  rpc GetAll(repository.common.Empty)
      returns (UserList);

  rpc GetById(repository.common.IdRequest)
      returns (User);

  rpc GetByEmail(EmailRequest)
      returns (User);

  rpc GetByPhoneNumber(PhoneNumberRequest)
      returns (User);

  rpc Create(User)
      returns (User);

  rpc ChangePassword(ChangePasswordRequest)
      returns (repository.common.Empty);

  rpc Update(UpdateUserRequest)
      returns (User);

  rpc Delete(repository.common.IdRequest)
      returns (repository.common.Empty);
}