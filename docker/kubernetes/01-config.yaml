apiVersion: v1
kind: ConfigMap
metadata:
  name: bank-repository-config
  namespace: bank
  labels:
    app.kubernetes.io/name: bank-repository
    app.kubernetes.io/part-of: bank
data:
  APP_ENV: kubernetes
  GRPC_HOST: 0.0.0.0
  GRPC_PORT: "50052"
  NETWORK: tcp
  SHUTDOWN_TIMEOUT: 20s
  DB_HOST: bank-repository-postgres
  DB_PORT: "5432"
  DB_USER: postgres
  DB_NAME: bank
  DB_SSL_MODE: disable
  DB_MAX_OPEN_CONNS: "25"
  DB_MAX_IDLE_CONNS: "5"
  DB_CONN_MAX_LIFETIME: 30m
  DB_CONN_MAX_IDLE_TIME: 5m
  REDIS_ADDR: bank-repository-redis:6379
  REDIS_DB: "0"
  REDIS_POOL_SIZE: "10"
  REDIS_MIN_IDLE: "2"
  # Kafka is shared infrastructure owned by the main backend deployment.
  KAFKA_ENABLED: "true"
  KAFKA_BROKERS: kafka:9092
  KAFKA_TOPICS: bank.user.events,bank.account.events,bank.card.events,bank.credit.events,bank.deposit.events,bank.currency.events
  KAFKA_CLIENT_ID: bank-repository-service
  KAFKA_CONSUMER_GROUP: bank-repository-service
---
apiVersion: v1
kind: Secret
metadata:
  name: bank-repository-secret
  namespace: bank
  labels:
    app.kubernetes.io/name: bank-repository
    app.kubernetes.io/part-of: bank
type: Opaque
stringData:
  # Replace these local values before deploying outside a development cluster.
  DB_PASSWORD: local-repository-postgres-password
  REDIS_PASSWORD: local-repository-redis-password
