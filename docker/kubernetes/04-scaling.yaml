apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bank-repository
  namespace: bank
  labels:
    app.kubernetes.io/name: bank-repository
    app.kubernetes.io/part-of: bank
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bank-repository
  minReplicas: 2
  maxReplicas: 5
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bank-repository
  namespace: bank
  labels:
    app.kubernetes.io/name: bank-repository
    app.kubernetes.io/part-of: bank
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bank-repository
