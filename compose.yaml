name: bank-repository
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-bank}
    ports: ["${DB_PORT:-5432}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/migration/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/postgres/migration/create-test-db.sql:/docker-entrypoint-initdb.d/02-create-test-db.sql:ro
      - ./docker/postgres/migration/init_test.sql:/docker-entrypoint-initdb.d/03-init-test.sql:ro
      - ./docker/postgres/migration/indexes.sql:/docker-entrypoint-initdb.d/04-indexes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [bank]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [bank]

  kafka:
    image: apache/kafka:4.3.1
    profiles: ["kafka"]
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes: ["kafka_data:/var/lib/kafka/data"]
    restart: unless-stopped
    networks: [bank]

  repository-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    image: bank-repository-service:local
    env_file:
      - path: .env
        required: false
    environment:
      GRPC_HOST: 0.0.0.0
      DB_HOST: postgres
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:19092
    ports: ["${GRPC_PORT:-50052}:50052"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    stop_grace_period: 15s
    restart: unless-stopped
    networks: [bank]

volumes:
  postgres_data:
  redis_data:
  kafka_data:
networks:
  bank:
    name: bank-network
